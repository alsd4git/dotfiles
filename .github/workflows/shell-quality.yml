name: Shell Quality

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      full_install:
        description: Run the full Linux installer, including optional tool bootstrap
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt

      - name: ShellCheck
        run: |
          shellcheck -x \
            install.sh \
            lib/installer-cli.sh \
            lib/bootstrap-policy.sh \
            lib/installer-report.sh \
            lib/installer-files.sh \
            lib/installer-git.sh \
            lib/installer-toolchains.sh \
            lib/installer-platforms.sh \
            lib/tool-manifest.sh \
            scripts/health-check.sh \
            scripts/tool-health-check.sh \
            tests/test-installer-functions.sh \
            tests/docker-ubuntu-smoke.sh \
            macos/defaults.sh \
            macos/dock.sh \
            archive/old_setup.sh \
            general/.aliases \
            general/.functions \
            general/.history_settings \
            general/.omp_init \
            git/.git_aliases \
            git/.git_functions

      - name: shfmt (check only)
        run: |
          shfmt -d -i 4 -ci -bn \
            install.sh \
            lib/installer-cli.sh \
            lib/bootstrap-policy.sh \
            lib/installer-report.sh \
            lib/installer-files.sh \
            lib/installer-git.sh \
            lib/installer-toolchains.sh \
            lib/installer-platforms.sh \
            lib/tool-manifest.sh \
            scripts/health-check.sh \
            scripts/tool-health-check.sh \
            tests/test-installer-functions.sh \
            tests/docker-ubuntu-smoke.sh \
            macos/defaults.sh \
            macos/dock.sh \
            archive/old_setup.sh \
            general/.aliases \
            general/.functions \
            general/.history_settings \
            general/.omp_init \
            git/.git_aliases \
            git/.git_functions

  dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run installer dry-run
        env:
          HOME: ${{ runner.temp }}/dotfiles-dry-run-home
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          ./install.sh --dry-run --minimal

  tool-health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Check curated tool versions
        run: ./scripts/tool-health-check.sh

  installer-function-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test interactive installer functions with stubs
        run: ./tests/test-installer-functions.sh

  ubuntu-container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test Bash and Zsh lifecycle in Ubuntu 24.04
        run: ./tests/docker-ubuntu-smoke.sh

  macos-dry-run:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate macOS defaults and Dock dry-runs
        run: |
          set -euo pipefail
          ./macos/defaults.sh --dry-run --restart
          ./macos/dock.sh --dry-run --restart

  smoke-install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [bash, zsh]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zsh
        if: matrix.shell == 'zsh'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh

      - name: Run minimal install
        env:
          HOME: ${{ runner.temp }}/dotfiles-smoke-${{ matrix.shell }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME"

          if [ "${{ matrix.shell }}" = "zsh" ]; then
            shell_bin="$(command -v zsh)"
          else
            shell_bin="/bin/bash"
          fi

          export SHELL="$shell_bin"
          ./install.sh --minimal

          mkdir -p "$HOME/.local/bin"
          cat >"$HOME/.local/bin/codex-smoke" <<'EOF'
          #!/usr/bin/env bash
          echo smoke
          EOF
          chmod +x "$HOME/.local/bin/codex-smoke"

          env -i HOME="$HOME" SHELL="$shell_bin" PATH="/usr/bin:/bin" "$shell_bin" -ic '
            type aa >/dev/null
            type l >/dev/null
            type gl >/dev/null
            command -v codex-smoke >/dev/null
            ! netuse >/dev/null 2>&1
            ! netuse --iface definitely-not-an-interface true >/dev/null 2>&1
            netuse --iface lo printf "%s\\n" "hello world" >/dev/null
          '

  installer-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install and uninstall without changing pre-existing Git settings
        env:
          HOME: ${{ runner.temp }}/dotfiles-lifecycle-home
          SHELL: /bin/bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          git config --global pull.rebase false
          git config --global core.editor vim
          git config --global core.pager less
          printf 'keep me\n' >"$HOME/foreign.bak.999"
          printf 'legacy\n' >"$HOME/.shell_aliases"
          # shellcheck disable=SC2016
          printf '# Remove duplicates from PATH\nexport PATH=$(echo "$PATH" | tr ":" "\\n" | awk "!seen[\\$0]++" | paste -sd:)\n' >"$HOME/.bashrc"

          ./install.sh --skip-tools --force
          if grep -Fq '# Remove duplicates from PATH' "$HOME/.bashrc"; then exit 1; fi
          # shellcheck disable=SC2016
          if grep -Fq 'export PATH=$(echo "$PATH" | tr ":" "\\n" | awk "!seen[\\$0]++" | paste -sd:)' "$HOME/.bashrc"; then exit 1; fi
          grep -Fq '# PATH de-dup (dotfiles installer)' "$HOME/.bashrc"
          test -f "$HOME/foreign.bak.999"
          tracked_backup="$(find "$HOME" -maxdepth 1 -name '.shell_aliases.bak.*' -print -quit)"
          test -n "$tracked_backup"
          ./install.sh --clean-backups --force --skip-tools
          test -f "$HOME/foreign.bak.999"
          test ! -e "$tracked_backup"
          test "$(git config --global --get pull.rebase)" = true
          test "$(git config --global --get core.editor)" = nano
          test "$(git config --global --get core.pager)" = less
          test -L "$HOME/.shell_aliases"
          ./scripts/health-check.sh --strict

          ./install.sh --uninstall
          test "$(git config --global --get pull.rebase)" = false
          test "$(git config --global --get core.editor)" = vim
          test "$(git config --global --get core.pager)" = less
          if git config --global --get core.excludesfile >/dev/null 2>&1; then exit 1; fi
          test ! -e "$HOME/.shell_aliases"

  windows-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse PowerShell sources and run the minimal dry-run
        shell: pwsh
        run: ./tests/windows-smoke.ps1

  full-install:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.full_install == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run the full Linux installer
        env:
          HOME: ${{ runner.temp }}/dotfiles-full-install-home
          SHELL: /bin/bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          ./install.sh --all --yes 2>&1 | tee "$RUNNER_TEMP/dotfiles-full-install.log"

          ./scripts/tool-health-check.sh --strict 2>&1 | tee -a "$RUNNER_TEMP/dotfiles-full-install.log"

      - name: Upload full-install log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotfiles-full-install-log
          path: ${{ runner.temp }}/dotfiles-full-install.log
          if-no-files-found: warn
